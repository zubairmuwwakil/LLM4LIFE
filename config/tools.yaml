version: 2
updated: 2026-09-03
status: migration_in_progress

status_vocabulary:
  connected: direct_runtime_path_verified
  partial: useful_path_exists_but_required_end_to_end_capability_is_incomplete
  available_unverified: connector_or_interface_exists_but_was_not_exercised_this_pass
  user_live: user_uses_tool_but_current_ai_direct_access_is_not_verified
  optional_planned: use_only_when_it_removes_real_friction
  transitional: currently_live_but_target_ownership_is_moving_elsewhere
  auxiliary: useful_capability_but_not_canonical_domain_owner

core_tools:
  chatgpt:
    status: connected
    role: primary_conversational_control_plane
    owns:
      - orchestration
      - routing
      - connected_tool_execution
    must_not_own:
      - durable_state_only_in_chat_history

  github:
    status: connected
    access:
      read_verified: true
      write_verified: true
    owns:
      - code
      - repository_truth
      - llm4life_public_architecture

  neon:
    status: connected
    role: v2_durable_llm4life_machine_state
    access:
      project_discovery_verified: true
      production_schema_read_verified: true
      production_schema_write_verified: true
      personal_action_data_read_verified: true
      personal_action_data_write_verified: true
    runtime_note: >-
      The dedicated llm4life project is connected. The v2 schema was validated
      on a disposable branch and applied to production. On 2026-09-02 the full
      transitional Notion task snapshot (15 actions) and Task Execution Log (2
      executions) were imported with parity verification and stable external
      references. The live planning automations now treat Neon as canonical.
    owns:
      - actions
      - action_executions
      - jobs_and_runs
      - events
      - receipts
      - sync_checkpoints
      - adaptive_rules
      - household_and_vehicle_maintenance
      - shopping_state

  google_tasks:
    status: connected
    role: preferred_user_facing_personal_action_client
    direct_chatgpt_connector_verified: false
    installed_plugin_found: false
    target_relationship: projection_and_authorized_capture_client_for_neon_action_state
    adapter:
      code_committed: true
      path: integrations/google-tasks-worker
      runtime: cloudflare_worker
      schedule: every_15_minutes
      deployment_status: production_live
      oauth_status: complete
      canonical_backend: neon
      calendar_time_owner: google_calendar
      deletion_rule: google_task_deletion_never_deletes_canonical_neon_action
      production_verified:
        successful_manual_sync: true
        successful_cron_sync: true
        google_task_external_refs: 14
        google_sync_checkpoints: 2
      hardening:
        current_live_worker: v0.1
        v0_2_committed_pending_redeploy: true
        neon_sql_transaction_batching: true
        google_tasks_multipart_batching: true
        incremental_updated_min_reads: true
        overlap_minutes: 5
    note: >-
      The first bulk production projection exceeded Cloudflare Free's 50
      external-subrequest limit after partially completing safely. A retry
      completed successfully without duplicate projections. v0.2 hardening is
      committed to batch DB and Google mutations before redeployment.

  cloudflare:
    status: connected
    role: edge_worker_runtime_for_google_tasks_projection
    user_stack: existing
    chatgpt_app_connection: enabled_by_user
    current_session_namespace_visible: false
    live_runtime:
      worker: llm4life-google-tasks-sync
      workers_dev_url_enabled: true
      schedule: every_15_minutes
      google_tasks_sync_verified: true
    note: >-
      Cloudflare is production-live for the Google Tasks projection. The
      official ChatGPT app is enabled, but this current session still does not
      expose a Cloudflare tool namespace; deployment changes therefore require
      Wrangler until that namespace is available.

  google_calendar:
    status: connected
    access:
      read_verified: true
      write_verified: true
    owns:
      - fixed_time_commitments
      - execution_schedule
    does_not_own:
      - permanent_general_backlog

  notion:
    status: transitional
    access:
      current_connector: available
    planning_role: rollback_reference_only
    still_live_domains:
      - shopping_needs_until_migrated
    migrated_planning_sources:
      - tasks
      - task_execution_log
      - scheduling_model
      - ai_activity_log_no_longer_live_audit_target
    target_role:
      - optional_dashboard
      - optional_projection
      - ad_hoc_structured_workspace
    rule: do_not_write_migrated_planning_state_as_canonical

  things3:
    status: user_live
    target_role: legacy_or_optional_task_ux
    direct_ai_bridge_verified: false
    v2_canonical: false

  obsidian:
    status: partial
    role: canonical_narrative_knowledge_and_relationship_context
    current_ai_path:
      github_backup_repo_access: true
      direct_live_local_vault_bridge_verified: false
    preferred_future_path: trusted_local_bridge

  google_contacts:
    status: available_unverified
    role: preferred_canonical_address_book_after_dedup_migration
    current_state: fragmented_with_apple_contacts

  apple_contacts:
    status: user_live
    role: current_address_book_client
    target_role: synced_client_after_google_contacts_migration

  jira:
    status: available_unverified
    role: canonical_engineering_backlog
    connector: atlassian_rovo
    rule: harmless_read_before_claiming_live_access_when_task_depends_on_it

  orc:
    status: external_specialist
    repository: zubairmuwwakil/agent-orchestrator
    role: coding_agent_orchestration

  gmail:
    status: connected
    role: email_and_intake_source
    rule: route_durable_actions_and_state_to_domain_owner

  slack:
    status: connected
    role: work_communication_and_automation_surface

  discord:
    status: user_live
    role: preferred_historical_personal_ai_channel
    direct_chatgpt_connector_verified: false
    candidate_bridge:
      - openclaw
      - thin_custom_bridge

  whatsapp:
    status: user_live
    role: personal_communication_source_and_optional_ai_channel
    direct_runtime_path: verify_before_use

  imessage:
    status: user_live
    role: personal_communication_source
    likely_bridge: trusted_local_mac_bridge

  openclaw:
    status: optional_planned
    role: channel_and_local_integration_plumbing
    rule: not_a_database_and_not_a_second_policy_authority

  google_drive:
    status: auxiliary
    role: preferred_canonical_cloud_file_store

  onedrive:
    status: user_live
    role: secondary_or_exception_file_store_pending_audit

  apple_health:
    status: user_live
    role: health_aggregation
    llm4life_copy_policy: no_by_default

  inunity:
    status: connected
    role: consolidated_user_owned_financial_system
    mcp:
      implementation_status: complete
      recent_read_verified: true
      verified_operation: get_attention_summary
      current_session_namespace_visible: false
    runtime_note: >-
      The ChatGPT MCP integration has been completed and successfully exercised.
      The current connector registry for this specific session is not exposing
      the InUnity namespace, so re-verify the namespace before a task that needs
      a live call rather than treating the integration as absent.

  pickme:
    status: domain_application
    role: card_decision_and_purchase_capture
    data_direction: inunity

  marketlens:
    status: domain_application
    role: market_data_service
    data_direction: inunity

agents:
  chatgpt:
    role: primary_life_control_plane
  claude_code:
    role: coding_worker_or_specialist
    preferred_routing: orc_when_practical
  codex:
    role: coding_worker
    preferred_routing: orc_when_practical
  gemini:
    role: complementary_ai_and_browser_assistant
  github_copilot:
    role: coding_assistant
  chatgpt_automations:
    role: current_scheduled_execution_surface
    durable_state: neon_actions_executions_rules_and_receipts

canonical_routing_v2:
  personal_action_backend: neon
  personal_action_client: google_tasks
  personal_action_projection_runtime: cloudflare_worker
  engineering_backlog: jira
  code_repository_truth: github
  coding_orchestration: orc
  scheduled_execution: google_calendar
  llm4life_machine_state: neon
  narrative_knowledge: obsidian
  contact_identity_after_migration: google_contacts
  relationship_context: obsidian
  finance_consolidated: inunity
  finance_chatgpt_interface: inunity_mcp
  work_communication: slack
  email_source_context: gmail

runtime_rules:
  - neon_is_canonical_for_personal_action_state_after_2026_09_02_cutover
  - notion_planning_databases_are_rollback_reference_not_live_write_targets
  - google_tasks_is_live_projection_and_authorized_capture_client_not_canonical_backend
  - google_task_deletion_must_not_delete_canonical_neon_action
  - google_calendar_remains_time_of_day_execution_owner
  - google_tasks_worker_bulk_io_should_use_batching_to_respect_cloudflare_free_subrequest_limits
  - verify_live_connector_before_claiming_access
  - search_before_create
  - use_idempotency_for_repeated_automated_writes
  - link_instead_of_duplicate
  - preserve_provenance
  - public_repo_must_not_contain_sensitive_private_state
  - if_neon_unavailable_do_not_silently_fallback_to_notion_task_writes
