version: 2
updated: 2026-09-02
timezone: America/Toronto
status: live_neon_backend

runtime_backend:
  canonical_personal_action_state: neon_postgresql
  execution_calendar: google_calendar
  legacy_planning_source: notion_rollback_reference
  google_tasks_projection: pending_oauth_adapter
  cutover_verified: true

active:
  daily_planning_loop:
    title: Daily Planning Loop
    enabled: true
    schedule:
      local_times:
        - "07:30"
        - "19:30"
      frequency: daily
    timing_mode: exact
    purpose: morning_execution_sanity_check_and_evening_next_day_planning
    state_sources:
      - neon_actions
      - neon_external_refs
      - neon_adaptive_rules
      - neon_action_receipts
      - google_calendar
      - other_verified_sources_when_relevant
    transitional_sources:
      - notion_shopping_needs_for_personal_care_only
    prohibited_canonical_fallback:
      - notion_tasks
      - notion_scheduling_model
      - notion_ai_activity_log
    policies:
      protected_sleep: "23:00-07:00"
      weekday_work_soft_busy: "09:00-13:00"
      default_movable_window: "13:00-21:00"
      rolling_horizon_days: 7
      leave_buffer: true
      fixed_commitments_are_immovable_for_optimization: true
      waiting_work_does_not_consume_execution_time: true
      date_only_deadlines_do_not_get_invented_times: true
      if_neon_unavailable_do_not_write_notion_fallback: true

  calendar_task_followup:
    title: Calendar Task Follow-Up
    enabled: true
    schedule: hourly
    timing_mode: condition_watch
    purpose: capture_outcomes_for_recent_user_owned_task_style_calendar_blocks
    state_sources:
      - google_calendar
      - neon_actions
      - neon_external_refs
      - neon_action_executions
      - neon_adaptive_rules
      - neon_action_receipts
    legacy_resolution:
      notion_task_url_marker: supported_as_identifier_only
      notion_is_canonical: false
    policies:
      recurring_event_edits_apply_to_instance_only: true
      waiting_is_not_a_miss: true
      never_fabricate_actual_duration: true
      reassess_before_rescheduling: true
      avoid_blind_daily_push_forward: true
      deduplicate_overlapping_check_window: true
      execution_keys_are_idempotent: true
      if_neon_unavailable_do_not_write_notion_fallback: true

  weekly_systems_review:
    title: Weekly Systems Review
    enabled: true
    schedule:
      weekday: friday
      local_time: "17:00"
    timing_mode: flexible
    purpose: weekly_reconciliation_planning_learning_and_personal_care_restock_review
    state_sources:
      - neon_actions
      - neon_action_executions
      - neon_adaptive_rules
      - neon_external_refs
      - neon_action_receipts
      - google_calendar
      - jira_when_available
      - other_verified_sources_when_relevant
    transitional_sources:
      - notion_shopping_needs
    learning_thresholds:
      collect_only_below: 5
      tentative_from: 5
      autonomous_low_risk_rule_change_from: 10
    policies:
      explicit_user_instruction_overrides_learning: true
      learned_rules_are_soft_preferences: true
      friday_restock_is_part_of_weekly_review: true
      no_fake_learned_overrides: true
      if_neon_unavailable_do_not_write_notion_fallback: true

inactive_or_superseded:
  plan_tomorrow:
    status: disabled_merged_into_daily_planning_loop
  standalone_daily_systems_digest:
    status: superseded_by_daily_planning_loop_morning_run
  weekly_personal_care_restock:
    status: disabled_merged_into_weekly_systems_review
  personal_care_heartbeat:
    status: disabled
  relationship_conflict_practice:
    status: disabled
  stale_one_time_reminders:
    status: disabled_or_completed

design_rules:
  - one_automation_one_clear_responsibility
  - chat_thread_is_not_durable_job_state
  - planner_uses_neon_as_canonical_personal_action_state
  - notion_planning_databases_are_rollback_reference_only
  - planner_owns_movable_calendar_placement
  - calendar_is_execution_not_backlog
  - deduplicate_before_write
  - use_idempotency_for_retries_and_overlapping_windows
  - preserve_date_only_semantics
  - do_not_expand_permissions_automatically
  - google_tasks_is_projection_not_canonical_backend
  - github_actions_are_for_repository_ci_cd_not_general_personal_scheduling
