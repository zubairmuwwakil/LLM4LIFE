version: 2
status: migration_in_progress
updated: 2026-09-02
superseding_decision: docs/decisions/2026-09-02-production-architecture-v2.md
purpose: >-
  Machine-readable architecture for the user's AI-driven personal operating
  system. LLM4LIFE is the control/orchestration layer; canonical data stays in
  the best domain owner. The v2 migration moves LLM4LIFE-owned machine state
  from SaaS dashboards/chat history toward PostgreSQL while preserving
  specialized provider systems and Obsidian narrative knowledge.

principles:
  - one_owner_per_object
  - ai_is_interface_router_and_orchestrator_not_chat_database
  - neon_for_llm4life_machine_state
  - obsidian_for_narrative_knowledge_and_context
  - link_external_records_instead_of_copying
  - provider_authority_remains_with_provider
  - event_driven_over_manual_polling_when_reliable
  - idempotent_writes_and_execution_receipts
  - autonomous_for_safe_reversible_actions
  - consequential_actions_need_stronger_safeguards
  - minimum_useful_system_over_life_as_erp
  - capture_durable_signal_not_conversational_exhaust
  - free_or_already_paid_first
  - architecture_is_open_to_change

architecture:
  control_plane: llm4life
  primary_conversational_interface: chatgpt
  durable_machine_state: neon_postgresql
  narrative_knowledge: obsidian
  coding_orchestration: orc
  engineering_truth:
    backlog: jira
    code: github
  execution_surfaces:
    actions: google_tasks
    time: google_calendar
  transitional_projection_surfaces:
    - notion
  ingress_surfaces:
    - chatgpt
    - gmail
    - slack
    - discord_when_bridge_available
    - whatsapp_when_bridge_available
    - imessage_when_bridge_available
    - iphone_shortcuts
    - share_sheet
    - browser_capture

systems:
  llm4life:
    owns:
      - architecture_policy
      - routing_policy
      - integration_contracts
      - orchestration
    must_not_own:
      - raw_private_life_dump
      - provider_credentials
      - duplicate_domain_truth

  chatgpt:
    role: primary_conversational_control_surface
    owns:
      - conversational_orchestration
      - connected_tool_execution
    must_not_own:
      - durable_system_state_only_in_chat_history

  neon_postgresql:
    role: durable_llm4life_machine_state
    owns:
      - system_registry
      - external_references
      - personal_action_state
      - jobs_and_job_runs
      - normalized_events
      - action_receipts
      - sync_checkpoints
      - adaptive_rules
      - household_assets_and_maintenance
      - vehicle_maintenance
      - grocery_and_shopping_state
    avoid:
      - narrative_relationship_notes
      - full_message_history_by_default
      - health_records_by_default
      - financial_credentials
      - provider_owned_official_records

  google_tasks:
    role: preferred_user_facing_personal_action_client
    direction: projection_and_execution_client_for_v2_actions
    transitional_from:
      - things3
      - notion_tasks
    avoid:
      - rich_domain_state
      - engineering_backlog

  google_calendar:
    owns:
      - fixed_time_commitments
      - execution_schedule
      - selected_action_time_blocks
    avoid:
      - canonical_general_backlog

  google_contacts:
    role: preferred_canonical_address_book_after_dedup_migration
    owns_after_migration:
      - contact_identity
      - phone_email_address
      - birthday_where_appropriate
      - organization
    current_state: fragmented_with_apple_contacts

  apple_contacts:
    direction: synced_client_after_google_contacts_migration
    avoid: independently_maintained_second_address_book

  obsidian:
    repository: zubairmuwwakil/Obsidian
    role: private_human_readable_knowledge_and_context
    owns:
      - learning
      - reasoning
      - durable_knowledge
      - long_form_notes
      - diary_and_reflections
      - relationship_context
      - person_narrative_notes
      - research_context
    relationship_strategy:
      canonical_context: obsidian
      structured_metadata_first: frontmatter
      backend_projection: only_when_cross_system_automation_justifies_it
    current_ai_path:
      github_backup_access: true
      direct_live_local_bridge_verified: false
    preferred_write_path: safe_local_bridge_to_live_vault
    learning_contract:
      preserve_retrieval_first_model: true
    avoid:
      - routine_task_backlog
      - duplicate_provider_state
      - secrets

  notion:
    role: transitional_structured_workspace_and_optional_projection
    direction: no_longer_default_canonical_backend
    current_live_dependencies_may_include:
      - task_planning_automation
      - task_execution_telemetry
      - personal_care_views
      - ai_activity_log
    migration_rule: keep_until_replacement_verified_then_reposition_or_retire_per_domain
    good_future_uses:
      - human_friendly_dashboards
      - optional_views
      - ad_hoc_collaboration
    avoid:
      - new_core_state_that_belongs_in_neon
      - duplicate_jira_or_github_truth
      - duplicate_obsidian_knowledge

  things3:
    role: legacy_or_optional_task_ux
    direction: not_canonical_in_v2
    migration_rule: preserve_existing_data_until_reconciled

  github:
    owns:
      - code
      - commits
      - pull_requests
      - releases
      - repository_specific_technical_truth
      - llm4life_public_architecture

  jira:
    owns:
      - engineering_backlog
      - engineering_bugs
      - technical_work_items

  orc:
    repository: zubairmuwwakil/agent-orchestrator
    owns:
      - coding_agent_routing
      - quota_aware_escalation
      - coding_verification
      - cross_vendor_code_review
    integration_rule: llm4life_invokes_orc_without_reimplementing_orc

  inunity:
    owns:
      - user_owned_consolidated_financial_state
      - receipts_bills_and_subscription_functionality
    notes:
      - moneytalks_is_inunity
      - looply_functionality_has_been_absorbed
    inputs:
      - pickme
      - marketlens

  pickme:
    role: specialized_card_decision_and_purchase_capture
    data_direction: pickme_to_inunity

  marketlens:
    role: specialized_market_data_service
    data_direction: marketlens_to_inunity

  financial_providers:
    owns:
      - official_account_records
      - official_balances_and_transactions
      - execution
    rule: never_store_provider_credentials_in_llm4life

  gmail:
    role: email_and_intake_source
    routing_rule: durable_actions_and_state_go_to_domain_owner

  slack:
    role: work_communication_and_automation_surface
    avoid: canonical_task_database

  discord:
    role: preferred_historical_personal_ai_channel
    current_direct_chatgpt_access: not_assumed
    bridge_candidates:
      - openclaw
      - thin_custom_bridge

  whatsapp:
    role: personal_communication_source_and_optional_ai_channel
    direct_integration: verify_before_use

  imessage:
    role: personal_communication_source
    likely_requires: trusted_local_bridge

  openclaw:
    role: optional_channel_and_local_integration_plumbing
    status: evaluate_against_native_connectors_and_thin_bridges
    must_not_be:
      - second_policy_authority
      - canonical_database

  google_drive:
    role: preferred_canonical_cloud_file_store
    migration_from_onedrive: audit_before_consolidation

  onedrive:
    role: secondary_or_exception_file_store

  time_machine:
    role: local_disaster_recovery

  apple_health:
    role: health_aggregation
    llm4life_copy_policy: no_by_default

routing:
  personal_action: neon_postgresql
  personal_action_user_interface: google_tasks
  personal_action_scheduled_execution: google_calendar
  engineering_bug: jira
  engineering_backlog: jira
  code_or_repository_state: github
  coding_agent_work: orc
  scheduled_commitment: google_calendar
  llm4life_machine_state: neon_postgresql
  knowledge_or_reasoning: obsidian
  relationship_context: obsidian
  contact_identity: google_contacts_after_migration
  household_maintenance_state: neon_postgresql
  vehicle_maintenance_state: neon_postgresql
  grocery_or_shopping_state: neon_postgresql
  consolidated_finance_state: inunity
  official_financial_record: respective_financial_provider
  email_source_context: gmail
  work_communication: slack
  personal_communication: provider_channel

personal_actions:
  canonical_backend: neon_postgresql
  preferred_client: google_tasks
  execution_schedule: google_calendar
  lifecycle:
    - inbox
    - next
    - scheduled
    - waiting
    - done
    - cancelled
    - archived
  rule: calendar_event_is_a_projection_not_the_task
  migration:
    current_legacy_sources:
      - notion_tasks
      - things3
    do_not_delete_before_reconciliation: true

planning:
  enabled: true
  scheduler: ai_layer
  personal_backlog: neon_postgresql_after_migration
  engineering_backlog: jira
  execution_schedule: google_calendar
  adaptive_rules: neon_postgresql
  execution_telemetry: neon_postgresql
  protected_routine:
    sleep: "23:00-07:00"
  current_movable_work_default:
    start: "13:00"
    end: "21:00"
    timezone: America/Toronto
  principles:
    - fixed_commitments_are_not_moved_for_optimization
    - leave_buffer
    - distinguish_due_date_from_execution_time
    - waiting_items_do_not_consume_execution_time
    - repeated_misses_are_evidence_not_reason_for_blind_reschedule
    - next_7_days_is_short_high_confidence_horizon

jobs:
  registry: neon_postgresql
  public_design_registry: config/automations.yaml
  execution_may_use:
    - chatgpt_automations
    - cron
    - dedicated_worker
    - github_actions_for_repository_ci_only
  required_properties:
    - stable_job_identity
    - idempotency_key
    - execution_receipt
    - retries_or_failure_policy
    - logs_or_observability
    - least_privilege_credentials
  rule: chat_thread_is_not_durable_job_state

household:
  assets_and_maintenance: neon_postgresql
  action_output: google_tasks
  scheduled_output: google_calendar
  provider_apps: execution_or_source_only

grocery_and_shopping:
  state: neon_postgresql
  provider_choice: optimize_total_value_without_vendor_loyalty
  no_new_paid_list_app_by_default: true

relationships:
  contact_identity: google_contacts_after_migration
  narrative_context: obsidian
  interaction_context: obsidian
  structured_operations: obsidian_frontmatter_first
  follow_up_action: google_tasks
  scheduled_interaction: google_calendar
  neon_relationship_tables: not_yet_justified

health:
  canonical_aggregation: apple_health
  copy_to_neon_by_default: false
  public_repo_sensitive_details: prohibited

security:
  public_repo: true
  never_commit:
    - secrets
    - credentials
    - private_contact_data
    - private_relationship_notes
    - health_records
    - financial_identifiers
    - confidential_work_content
  least_privilege: true
  crypto_signing_isolated_from_autonomous_agents: true

free_first:
  enabled: true
  preference_order:
    - already_paid_for_capability
    - strong_free_tier
    - open_source_or_self_hosted_when_operationally_reasonable
    - paid_only_when_incremental_value_is_material
  production_grade_does_not_mean_more_subscriptions: true

migration:
  phase: v2_foundation
  rules:
    - migrate_one_domain_at_a_time
    - do_not_destroy_working_legacy_state_before_verification
    - temporary_dual_read_is_allowed
    - avoid_long_term_dual_write
    - preserve_rollback
    - update_runtime_docs_when_live_cutover_occurs
  current_transitional_runtime:
    note: >-
      Existing ChatGPT planning automations may still depend on Notion Tasks,
      Task Execution Log, Scheduling Model, Shopping Needs, or AI Activity Log.
      Those live dependencies remain valid until migrated and verified; target
      architecture must not be confused with completed runtime cutover.

change_management:
  on_major_change:
    - add_or_update_decision_record
    - update_system_yaml
    - update_config_domains
    - update_runtime_docs_when_cutover_is_real
  precedence: newest_explicit_decision_wins
