version: 1
status: evolving
updated: 2026-08-27
purpose: >-
  Machine-readable description of the current AI-driven personal operating
  system. Current choices are defaults, not permanent doctrine.

principles:
  - one_owner_per_responsibility
  - ai_is_interface_and_router_not_database
  - link_instead_of_duplicate
  - autonomous_for_safe_reversible_actions
  - consequential_actions_need_stronger_safeguards
  - receipts_for_autonomous_writes
  - event_driven_over_manual_polling
  - optimize_attention_not_notification_volume
  - learned_preferences_are_soft_preferences
  - architecture_is_open_to_change
  - capture_durable_signal_not_conversational_exhaust

systems:
  github:
    owns:
      - code
      - pull_requests
      - commits
      - releases
      - repository_truth
  jira:
    owns:
      - engineering_bugs
      - engineering_backlog
      - technical_work_items
  things3:
    owns:
      - personal_actions
      - personal_reminders
      - next_actions
  google_calendar:
    owns:
      - time_commitments
      - scheduled_events
      - deadlines_when_time_itself_matters
  notion:
    owns:
      - structured_personal_state
      - life_operations
      - inventories
      - subscriptions_and_membership_metadata
      - renewals_and_expiries
      - warranties_and_documents_metadata
      - administrative_reference_data
      - ai_activity_log
    avoid:
      - duplicate_jira_backlog
      - duplicate_github_project_truth
      - deep_personal_knowledge
      - duplicate_core_financial_state
  obsidian:
    repository: zubairmuwwakil/Obsidian
    access_mode: autonomous_read_write
    owns:
      - personal_knowledge_context
      - thinking
      - learning
      - durable_knowledge
      - long_form_notes
      - daily_and_diary_context
      - para_areas_projects_resources
      - spaced_repetition_prompts
      - mistake_logs
      - contextual_research
    autonomous_writes:
      - create_contextual_notes
      - capture_durable_conversation_insights
      - triage_inbox_into_para
      - organize_and_move_notes
      - update_frontmatter
      - add_links_and_moc_references
      - merge_duplicate_or_overlapping_notes
      - rewrite_existing_notes_for_clarity_or_conflict_resolution
      - archive_reversible_stale_material
      - connect_to_canonical_external_records
    conversation_capture:
      enabled: true
      explicit_save_phrase_required: false
      policy_doc: docs/KNOWLEDGE_CAPTURE.md
      capture:
        - durable_insights
        - decisions_with_rationale
        - lessons_and_mistakes
        - reusable_frameworks_and_processes
        - research_conclusions
        - meaningful_project_reasoning
        - stable_workflow_preferences
        - useful_personal_context_when_appropriate
      skip:
        - casual_chatter
        - transient_answers
        - one_off_logistics_owned_elsewhere
        - duplicate_canonical_information
        - raw_transcripts_by_default
        - temporary_status
        - receipts_and_notifications
      sensitive_implicit_capture:
        credentials_and_secrets: prohibited
        high_risk_identifiers: prohibited
        unusually_sensitive_personal_material: require_explicit_storage_intent
      search_before_create: true
      prefer_update_or_merge: true
      preserve_provenance_when_useful: true
      log_material_captures: true
    merge_rewrite_policy:
      enabled: true
      preserve_user_authored_reasoning: true
      preserve_provenance_and_dates: true
      preserve_or_repair_links: true
      prefer_merge_or_archive_over_delete: true
      unresolved_conflicts: preserve_with_context_or_flag_for_review
      avoid_false_certainty: true
      log_material_changes: true
    avoid:
      - routine_task_management
      - structured_operational_state_when_notion_is_canonical
      - duplicate_github_content
      - duplicate_live_financial_state
      - bypass_learning_contract_with_answer_generation
    principles:
      - one_home_per_item
      - link_instead_of_copy
      - retrieval_first_for_learning
      - prefer_archive_over_delete
    learning_contract:
      agents_entrypoint: AGENTS.md
      canonical_manual: "50 Resources/Software Engineering/_System/AI Operating Manual (READ ME).md"
      prime_directive: ai_may_improve_output_but_must_not_replace_learning_thinking
      overrides_general_frictionless_automation_when_learning: true
  slack:
    owns:
      - work_communication
      - software_engineering_communication
      - work_notification_surface
  discord:
    owns:
      - personal_communication
      - personal_notification_surface
  gmail:
    owns:
      - email_source_context
      - email_intake

routing:
  engineering_bug: jira
  engineering_backlog_item: jira
  code_change_or_repo_state: github
  personal_action: things3
  time_commitment: google_calendar
  structured_life_state: notion
  knowledge_or_thinking: obsidian
  contextual_personal_note: obsidian
  durable_conversation_insight: obsidian
  work_communication: slack
  personal_communication: discord

ai_layer:
  desired_entry_points:
    - chatgpt
    - slack
    - discord
    - iphone_shortcuts_or_share_sheet
    - email
    - browser_capture
  candidate_components:
    chatgpt: primary_interface_and_native_plugins
    claude: coding_heavy_agent
    openclaw: integration_and_channel_plumbing_where_needed
  behavior:
    autonomous: true
    deduplicate_before_write: true
    source_provenance: true
    send_receipt_after_write: true
    consolidate_multi_action_receipts: true
    log_meaningful_writes: true
    proactively_capture_durable_conversation_knowledge: true

safeguards:
  auto_allowed_examples:
    - create_low_risk_task
    - create_or_update_jira_work_item
    - update_notion_structured_state
    - create_or_organize_obsidian_knowledge
    - capture_durable_conversation_insight_to_obsidian
    - merge_or_rewrite_obsidian_knowledge_with_provenance
    - add_calendar_event
    - classify_or_tag
    - low_risk_reversible_cleanup
  stronger_review_examples:
    - destructive_delete
    - externally_consequential_message
    - purchase_or_new_subscription
    - cancel_subscription
    - production_change
    - hard_to_reverse_action

notifications:
  work_default: slack
  personal_default: discord
  philosophy: exceptions_and_high_value_signals_only

daily_digest:
  enabled: true
  approximate_time: "08:00 America/Toronto"
  sections:
    - top_3_priorities
    - needs_attention_today
    - work_engineering
    - personal_admin
    - upcoming_deadlines
    - neglected_but_important
    - what_can_be_ignored_today
    - cleanup_performed
    - learned_preferences
    - tool_roi_opportunities
    - automated_actions_taken
  priority_factors:
    - urgency
    - impact
    - dependencies
    - time_sensitivity
    - observed_behavior
  stale_resurface_window_days: "7-14+"

learning:
  enabled: true
  observe:
    - repeatedly_ignored
    - repeatedly_deferred
    - completed_quickly
    - manually_overridden
    - reopened
    - consistently_prioritized
  rule: learned_behavior_is_soft_preference_not_safety_override
  software_engineering_mode:
    source: obsidian_ai_operating_manual
    default_assistance_level: 0
    require_attempt_before_answer: true
    escalate_one_rung_at_a_time: true
    preserve_desirable_difficulty: true

tool_roi:
  enabled: true
  recommend:
    - cancel
    - downgrade
    - consolidate
    - replace
    - new_tool_or_integration
  constraint: prefer_existing_capabilities_before_new_subscription
  avoid: novelty_driven_tool_sprawl

known_current_conclusions:
  notion_best_role: personal_operations_and_life_database
  notion_generic_project_manager: likely_redundant
  obsidian_best_role: personal_knowledge_and_context_layer
  obsidian_access: autonomous_read_write_merge_rewrite_and_conversation_capture_with_learning_guardrails
  engineering_truth: github_plus_jira
  core_finance_truth: dedicated_finance_apps_not_notion

change_management:
  on_major_change:
    - update_system_yaml
    - update_current_state_docs
    - append_decision_log
  precedence: newest_explicit_decision_wins
