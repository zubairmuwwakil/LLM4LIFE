name: Task Engine CI

on:
  pull_request:
    paths:
      - "services/task-engine/**"
      - "db/migrations/007_replace_calendar_execution_binding.sql"
      - ".github/workflows/task-engine-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/task-engine/**"
      - "db/migrations/007_replace_calendar_execution_binding.sql"
      - ".github/workflows/task-engine-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/task-engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --dev
      # Block correctness/bug-prone lint without making this rollout depend on
      # unrelated legacy formatting cleanup. FastAPI Depends defaults intentionally
      # trigger B008 and are excluded.
      - run: uv run ruff check task_engine tests migrations --select F,B,UP --ignore B008
      - run: uv run pytest -q
      - run: uv run python -m compileall -q task_engine migrations tests
