name: People Phase 4 CI

on:
  push:
    paths:
      - "db/migrations/005_person_facts_asserted_on.sql"
      - "db/migrations/006_people_memory_graph.sql"
      - "scripts/people_obsidian_link.py"
      - "scripts/people_obsidian_discover.py"
      - "scripts/people_obsidian_candidates.py"
      - "scripts/people_diary_fact_review.py"
      - "scripts/import_people_diary_plan.py"
      - "scripts/people_structured_memory_review.py"
      - "scripts/import_people_structured_memory.py"
      - "scripts/obsidian_local_bridge.py"
      - "scripts/import_people_obsidian_refs.py"
      - "scripts/repo_env.py"
      - "scripts/init_local_env.py"
      - "scripts/launch_obsidian_bridge.py"
      - "scripts/run_obsidian_bridge.sh"
      - "tests/test_people_obsidian_link.py"
      - "tests/test_people_obsidian_candidates.py"
      - "tests/test_people_diary_fact_review.py"
      - "tests/test_import_people_diary_plan.py"
      - "tests/test_people_structured_memory_review.py"
      - "tests/test_import_people_structured_memory.py"
      - "tests/test_obsidian_live_bridge.py"
      - "tests/test_repo_env.py"
      - "docs/people/OBSIDIAN_LINKAGE.md"
      - "docs/people/OBSIDIAN_CANDIDATE_REVIEW.md"
      - "docs/people/DIARY_FACT_REVIEW.md"
      - "docs/people/DIARY_NEON_IMPORT.md"
      - "docs/people/PEOPLE_MEMORY_MODEL.md"
      - "docs/people/STRUCTURED_MEMORY_REVIEW.md"
      - "config/people-phase4.yaml"
      - "requirements-people-phase4.txt"
      - ".env.example"
      - ".gitignore"
      - ".github/workflows/people-phase4-ci.yml"
  pull_request:
    paths:
      - "db/migrations/005_person_facts_asserted_on.sql"
      - "db/migrations/006_people_memory_graph.sql"
      - "scripts/people_obsidian_link.py"
      - "scripts/people_obsidian_discover.py"
      - "scripts/people_obsidian_candidates.py"
      - "scripts/people_diary_fact_review.py"
      - "scripts/import_people_diary_plan.py"
      - "scripts/people_structured_memory_review.py"
      - "scripts/import_people_structured_memory.py"
      - "scripts/obsidian_local_bridge.py"
      - "scripts/import_people_obsidian_refs.py"
      - "scripts/repo_env.py"
      - "scripts/init_local_env.py"
      - "scripts/launch_obsidian_bridge.py"
      - "scripts/run_obsidian_bridge.sh"
      - "tests/test_people_obsidian_link.py"
      - "tests/test_people_obsidian_candidates.py"
      - "tests/test_people_diary_fact_review.py"
      - "tests/test_import_people_diary_plan.py"
      - "tests/test_people_structured_memory_review.py"
      - "tests/test_import_people_structured_memory.py"
      - "tests/test_obsidian_live_bridge.py"
      - "tests/test_repo_env.py"
      - "docs/people/OBSIDIAN_LINKAGE.md"
      - "docs/people/OBSIDIAN_CANDIDATE_REVIEW.md"
      - "docs/people/DIARY_FACT_REVIEW.md"
      - "docs/people/DIARY_NEON_IMPORT.md"
      - "docs/people/PEOPLE_MEMORY_MODEL.md"
      - "docs/people/STRUCTURED_MEMORY_REVIEW.md"
      - "config/people-phase4.yaml"
      - "requirements-people-phase4.txt"
      - ".env.example"
      - ".gitignore"
      - ".github/workflows/people-phase4-ci.yml"

permissions:
  contents: read

jobs:
  obsidian-linkage-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Obsidian Phase 4 synthetic tests
        run: >-
          python -m unittest -v
          tests/test_people_obsidian_link.py
          tests/test_people_obsidian_candidates.py
          tests/test_people_diary_fact_review.py
          tests/test_import_people_diary_plan.py
          tests/test_people_structured_memory_review.py
          tests/test_import_people_structured_memory.py
          tests/test_obsidian_live_bridge.py
          tests/test_repo_env.py
      - name: Compile Phase 4 Python helpers
        run: >-
          python -m compileall -q
          scripts/people_obsidian_link.py
          scripts/people_obsidian_discover.py
          scripts/people_obsidian_candidates.py
          scripts/people_diary_fact_review.py
          scripts/import_people_diary_plan.py
          scripts/people_structured_memory_review.py
          scripts/import_people_structured_memory.py
          scripts/obsidian_local_bridge.py
          scripts/import_people_obsidian_refs.py
          scripts/repo_env.py
          scripts/init_local_env.py
          scripts/launch_obsidian_bridge.py
      - name: Verify date-only fact provenance migration
        run: grep -F 'ADD COLUMN IF NOT EXISTS asserted_on date' db/migrations/005_person_facts_asserted_on.sql
      - name: Verify People memory graph migration guards
        run: |
          grep -F 'CREATE TABLE IF NOT EXISTS llm4life.person_dates' db/migrations/006_people_memory_graph.sql
          grep -F 'CREATE TABLE IF NOT EXISTS llm4life.person_relationship_edges' db/migrations/006_people_memory_graph.sql
          grep -F 'CHECK (source_person_id <> target_person_id)' db/migrations/006_people_memory_graph.sql
          grep -F "CHECK (NOT (source_kind='model_suggestion' AND sensitivity_class='sensitive'))" db/migrations/006_people_memory_graph.sql
          grep -F 'make_date(2000, month::integer, day::integer)' db/migrations/006_people_memory_graph.sql
      - name: Validate local bridge wrapper syntax
        run: bash -n scripts/run_obsidian_bridge.sh
      - name: Verify localhost-only bind remains explicit
        run: grep -F 'ObsidianBridgeServer(("127.0.0.1", args.port), state)' scripts/obsidian_local_bridge.py
      - name: Verify private runtime paths remain ignored
        run: |
          grep -Fx '.private/' .gitignore
          grep -Fx '.env' .gitignore
          grep -Fx '__pycache__/' .gitignore
          grep -Fx '*.py[cod]' .gitignore
