name: Google Tasks Worker CI

on:
  pull_request:
    paths:
      - "integrations/google-tasks-worker/**"
      - ".github/workflows/google-tasks-worker-ci.yml"
  push:
    branches:
      - main
    paths:
      - "integrations/google-tasks-worker/**"
      - ".github/workflows/google-tasks-worker-ci.yml"

permissions:
  contents: read

jobs:
  validate-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/google-tasks-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Syntax check
        run: node --check src/index.js

      - name: Wrangler dry run
        run: npm run deploy:dry
